name: Release

# Changesets flow: pending changesets on main open a version PR, and merging
# that PR publishes. Nothing runs until the repository variable RELEASE_ENABLED
# is `true`, so the first release from this repository is the owner's decision.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    # A dispatch from any other branch would publish unreviewed code with VSCE_PAT.
    if: github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    # Created on first run with no branch policy; main-only waits on #209.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Not github.token: its pushes and pull requests trigger no workflows, so the version PR would never get its Check.
      - name: Mint the sferarc-hq App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HQ_APP_ID }}
          private-key: ${{ secrets.HQ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - run: pnpm install --frozen-lockfile

      # A run on a superseded commit would reopen the version PR for a release that already shipped.
      - name: Skip when the branch has moved on
        id: head
        run: |
          head="$(git ls-remote --exit-code origin "${GITHUB_REF}" | cut -f1)"
          if [ -z "${head}" ]; then
            echo "::error::Could not read the head of ${GITHUB_REF}"
            exit 1
          fi
          if [ "${head}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::${GITHUB_SHA} is no longer the head of ${GITHUB_REF} (now ${head}), so this run skips; the run on the newer commit versions and releases"
            echo "current=false" >> "${GITHUB_OUTPUT}"
          fi

      # The extension goes to the VS Code Marketplace only; nothing is published to npm.
      - name: Create version PR or publish
        id: changesets
        if: steps.head.outputs.current == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          github-token: ${{ steps.app.outputs.token }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # The version PR only carries what `changeset version` generated, so the required Check is the whole review.
      - name: Enable auto-merge on the version PR
        if: steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge --squash --auto "${{ steps.changesets.outputs.pr-number }}"

      # privatePackages.tag is false, so changesets/action creates no tag or release.
      # Only without pending changesets: otherwise this push published nothing.
      - name: Tag and create GitHub release
        if: github.ref == 'refs/heads/main' && steps.head.outputs.current == 'true' && steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: ./scripts/github-release.sh
