name: Release

# Changesets flow: pending changesets on main open a version PR, and merging
# that PR publishes. Nothing runs until the repository variable RELEASE_ENABLED
# is `true`, so the first release from this repository is the owner's decision.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - run: pnpm install --frozen-lockfile

      - name: Warn when GIT_TOKEN is missing
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          [ -n "$GIT_TOKEN" ] || echo "::warning::GIT_TOKEN is not set; the version PR and its branch push trigger no pull_request workflows, so the required Check never runs on it until CI is triggered by hand."

      # Prefer GIT_TOKEN: pushes and pull requests made by the Actions token
      # trigger no workflows, so the version PR would never get its Check.
      # The extension goes to the VS Code Marketplace only; nothing is published to npm.
      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          github-token: ${{ secrets.GIT_TOKEN || github.token }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # privatePackages.tag is false, so changesets/action creates no tag or release.
      # Only without pending changesets: otherwise this push published nothing.
      - name: Tag and create GitHub release
        if: github.ref == 'refs/heads/main' && steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} exists"
          else
            gh release create "v${version}" --target "${GITHUB_SHA}" --title "v${version}" --generate-notes
          fi
