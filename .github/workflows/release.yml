name: Release

# Changesets flow: pending changesets on main open a version PR, and merging
# that PR publishes. Nothing runs until the repository variable RELEASE_ENABLED
# is `true`, so the first release from this repository is the owner's decision.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Not github.token: its pushes and pull requests trigger no workflows, so the version PR would never get its Check.
      - name: Mint the sferarc-hq App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HQ_APP_ID }}
          private-key: ${{ secrets.HQ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - run: pnpm install --frozen-lockfile

      # The extension goes to the VS Code Marketplace only; nothing is published to npm.
      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          github-token: ${{ steps.app.outputs.token }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # privatePackages.tag is false, so changesets/action creates no tag or release.
      # Only without pending changesets: otherwise this push published nothing.
      - name: Tag and create GitHub release
        if: github.ref == 'refs/heads/main' && steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} exists"
          else
            gh release create "v${version}" --target "${GITHUB_SHA}" --title "v${version}" --generate-notes
          fi
