catalog:
  '@ai-sdk/gateway': 4.0.138
  '@biomejs/biome': 2.6.6
  '@changesets/cli': 3.0.3
  '@types/json-schema': 7.0.15
  '@types/node': 26.6.6
  '@vscode/vsce': 4.1.0
  ai: 7.0.165
  bunchee: 7.0.2
  knip: 6.44.2
  lefthook: 2.2.2
  # bunchee refuses to build on TypeScript 7 without the TypeScript 6 JavaScript API, which it
  # looks for by name. Remove the shim once bunchee runs on TS 7 alone.
  typescript: 7.0.2
  '@typescript/typescript6': 6.0.2
  vitest: 5.1.0
  '@vscode/test-electron': 3.1.0
  '@vscode/l10n-dev': 0.0.35
catalogMode: strict
cleanupUnusedCatalogs: true
saveExact: true
allowBuilds:
  '@swc/core': false
  '@vscode/vsce-sign': false
  esbuild: false
  keytar: false
  # lefthook's postinstall fetches its binary.
  lefthook: true
# Security floors carried over from the SferaDev/SferaDev monorepo for the packages this repo resolves.
overrides:
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  qs@>=6.11.1 <=6.15.1: ^6.15.2
  rollup@>=4.0.0 <4.59.0: ^4.59.0
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.16.0
  undici@>=8.0.0 <8.10.2: ^8.10.2
# Advisories that CI's `pnpm audit --prod --audit-level high` accepts. One GHSA per line, with a
# comment giving the reason and the condition that ends the exception.
auditConfig:
  ignoreGhsas: []
